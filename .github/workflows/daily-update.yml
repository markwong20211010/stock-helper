name: 每日更新股票數據

on:
  schedule:
    # GitHub Actions 只用 UTC；09:15 UTC = 香港時間 17:15
    # 只跑週一至週五（港股交易日），收市價 16:08 已定
    - cron: '15 9 * * 1-5'
  workflow_dispatch: {}   # 可在 Actions 頁手動按 Run workflow

permissions:
  contents: write

concurrency:
  group: stock-helper-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 重要：只讀 stocks.json、只寫 data.json —— 唔會再改 index.html，
      # 所以你上傳／編輯頁面唔會同機械人撞出「合併衝突」。
      - name: 抓收市價並生成 data.json
        run: python3 scripts/update_stock_data.py

      - name: 檢查頁面有無未解決的合併衝突
        run: |
          if grep -nE '^(<<<<<<<|>>>>>>>)' index.html; then
            echo "::error::index.html 仍有未解決的 Git 衝突標記，請重新上傳乾淨版本"
            exit 1
          fi

      - name: 提交並推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "今日價格無變化，不提交"
            exit 0
          fi
          git commit -m "chore: 更新股票數據 $(TZ=Asia/Hong_Kong date +%F)"
          # 你隨時會喺網頁上傳／改檔案，機械人跑緊時遠端可能已有新 commit，
          # 直接 push 會被拒（non-fast-forward）。所以先 rebase 再重試。
          for i in 1 2 3; do
            echo "第 $i 次嘗試推送…"
            if git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "遠端有新提交，改為 rebase 後再推"
            git pull --rebase origin main || { echo "::error::rebase 失敗（可能同一檔案兩邊都改），請手動處理"; exit 1; }
            sleep 3
          done
          echo "::error::連續 3 次推送失敗"
          exit 1
#（注：内容由AI生成）
